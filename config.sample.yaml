# synapse-media-worker configuration.
#
# The worker reads Synapse's media store and database directly. Values here
# must agree with homeserver.yaml; they are duplicated rather than parsed out of
# it so the worker has no coupling to Synapse's config schema.

# Read settings from Synapse's own config instead of repeating them here.
#
# Strongly recommended. Synapse's size suffixes are binary -- max_image_pixels:
# 100M means 104857600, not 100000000 -- and transcribing them by hand drifts.
# Anything this file leaves unset is taken from there; anything set here wins.
#
# Mount it read-only. Note it contains every secret Synapse has
# (macaroon_secret_key, registration_shared_secret, form_secret); mount a
# stripped copy if the worker should not see them.
#
# synapse_config: /data/homeserver.yaml

# Derived from synapse_config when unset.
server_name: "example.com"

listen:
  # Unix socket to listen on. Takes precedence over addr.
  socket: /var/sockets/nginx/av-media-worker-go.sock
  socket_mode: 0666
  # addr: ":8090"
  # Optional separate listener for Prometheus. /metrics is also served on the
  # main listener, so set this only if you want it reachable separately.
  metrics_addr: ":9110"

database:
  # libpq connection string. For a unix socket, put the *directory* containing
  # the socket in the host parameter.
  #
  # Derived from Synapse's database.args when unset -- but note Synapse often
  # points at a connection pooler, while this single process is usually better
  # off connecting directly. Set it explicitly to do that.
  uri: "postgres://synapse:CHANGEME@/synapse-db?host=/var/sockets&sslmode=disable"
  max_conns: 16
  # last_access_ts is the only thing the worker ever writes to Synapse's
  # database. Turning it off means media retention and LRU cleanup will treat
  # everything this worker serves as never accessed, and may delete it.
  update_last_access: true
  last_access_interval: 1m

media:
  # Synapse's media_store_path. Mount it read-only.
  store_path: /data/media_store
  # Synapse's signing key, used to authenticate outbound server-key lookups
  # while verifying inbound federation requests.
  signing_key_path: /data/signing.key
  # Derived from synapse_config when unset. Synapse's suffixes are binary, so
  # if you do set it here, 100M is 104857600.
  # max_image_pixels: 104857600
  # How many thumbnails may be generated at once. Generation is CPU-bound and
  # holds the decoded image in memory, so this bounds both. Defaults to the
  # number of usable CPUs; raise it only if generation is queueing while the
  # CPUs sit idle.
  # max_concurrent_thumbnails: 4
  # How long to wait for an in-progress async upload before returning 504.
  default_timeout: 20s
  max_timeout: 60s
  # Fetch uncached remote media over federation instead of proxying to Synapse.
  #
  # This is the only feature that WRITES to Synapse's media store, so it needs
  # the store mounted read-write. It is off by default, and any failure falls
  # back to proxying exactly as before. Only remote_content/ and
  # remote_thumbnail/ are ever written; media this server owns stays untouchable
  # in code.
  # Accept uploads from local users instead of proxying them to Synapse.
  #
  # This is the only feature that writes into local_content, so it widens the
  # write guard; url_cache stays unwritable in every configuration. Off by
  # default.
  accept_uploads: false
  max_concurrent_uploads: 8
  # What to generate when media is uploaded: "none" (default) or "synapse" for
  # byte-parity with Synapse's set.
  #
  # none is the better choice under dynamic_thumbnails, where Synapse's
  # upload-time thumbnails are written in a type no request path can ask for,
  # and where most uploads are never viewed at thumbnail size at all. Thumbnails
  # are still generated on demand, which is what serves every request.
  upload_thumbnails: none
  # Derived from synapse_config when unset.
  # max_pending_media_uploads: 5
  # unused_expiration_time: 24h

  fetch_remote: false
  max_concurrent_fetches: 4
  # Write thumbnails generated for REMOTE media into Synapse's media store
  # rather than the worker's own cache, so they are permanent instead of
  # LRU-evictable and Synapse can serve them too. Requires fetch_remote.
  # Local media thumbnails are unaffected and stay in the worker's cache.
  write_through_thumbnails: false
  fetch_timeout: 60s
  # Derived from synapse_config when unset. Caps how large a remote file the
  # worker will store.
  # max_upload_size: 52428800

  # Derived from synapse_config when unset; Synapse defaults it to true. When
  # true, media rows with authenticated = true are hidden from the legacy
  # unauthenticated /_matrix/media endpoints.
  # enable_authenticated_media: true

cache:
  # The worker's own writable directory for thumbnails it generates. This must
  # NOT be inside media.store_path; the worker refuses to start if it is.
  # Do not mount this volume noatime, or LRU eviction loses its ordering.
  dir: /data/cache
  max_bytes: 10737418240 # 10 GiB
  sweep_interval: 10m

auth:
  # Access tokens are validated by asking Synapse, because appservice tokens
  # and delegated auth (MAS) are not resolvable from the access_tokens table.
  # Point this at any worker that serves the client API.
  whoami_socket: /var/sockets/nginx/av-request-worker-1.sock
  # whoami_url: "https://example.com"
  positive_ttl: 5m
  negative_ttl: 30s
  max_entries: 20000

upstream:
  # Where to send requests the worker will not answer itself: remote media that
  # Synapse has not cached yet, and thumbnails it cannot generate.
  #
  # List every media worker you have. Requests are spread by least connections,
  # and an unreachable worker is skipped, so a single worker here is both a
  # bottleneck and a single point of failure. `socket:` (singular) still works
  # for one.
  download:
    sockets:
      - /var/sockets/nginx/av-media-worker-1.sock
      - /var/sockets/nginx/av-media-worker-2.sock
  thumbnail:
    sockets:
      - /var/sockets/nginx/av-media-worker-thumbnails.sock
  # Where uploads go when accept_uploads is off. Falls back to `download`.
  upload:
    socket: /var/sockets/nginx/av-media-worker-uploads.sock

log:
  level: info
  pretty: false
  # One line per request, recording what the worker did with it: served from
  # Synapse's store, from the worker's own thumbnail cache, generated, or
  # proxied back to Synapse (with the reason). That last part is what a reverse
  # proxy's own access log cannot tell you. Set false on a busy server if the
  # proxy log is enough.
  requests: true
